{% extends "base.html" %}
{% block title %}Coding Results{% endblock %}
{% block content %}
<h3>Test Summary</h3>
<p><strong>Total Score:</strong> {{ total_score }}%</p>

<table class="table">
  <thead>
    <tr><th>Question</th><th>Score</th></tr>
  </thead>
  <tbody>
    {% for s in submissions %}
    <tr>
      <td>{{ s.answers.question }}</td>
      <td>{{ s.score }}%</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<a href="/" class="btn btn-primary">Return Home</a>
{% endblock %}
